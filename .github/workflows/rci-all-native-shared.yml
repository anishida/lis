name: RCI all eight native cores integration
on:
  push:
    branches: ['qualification/rci-all-native-shared-20261127']
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: serial, index: int32, sanitize: 'no'}
          - {mode: openmp, index: int64, sanitize: 'no'}
          - {mode: serial, index: int64, sanitize: 'yes'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          python3 qualification/rci-restore/qualify_all_native.py
          opts=(--enable-rci --enable-test --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg)
          flags=(-std=gnu11 -DHAVE_CONFIG_H -O2)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp); flags+=(-fopenmp); else opts+=(--disable-omp); fi
          if [ "${{ matrix.index }}" = int64 ]; then opts+=(--enable-longlong); flags+=(-D_LONG__LONG); fi
          if [ "${{ matrix.sanitize }}" = yes ]; then
            export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
            export LDFLAGS='-fsanitize=address,undefined'
            flags+=(-g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie)
          fi
          ./configure "${opts[@]}"
          make -C src -j2
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          tests=(linear_native gcro_native fgcro_native krylov_restore feast_native)
          for t in "${tests[@]}"; do
            cc "${flags[@]}" -DLIS_RCI_KRYLOV_NATIVE_LIBRARY -Iinclude -Iqualification/rci-restore/ "qualification/rci-restore/test_$t.c" -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -o "$RUNNER_TEMP/$t"
            ldd "$RUNNER_TEMP/$t" | grep -F "$PWD/src/.libs/liblis.so"
            OMP_NUM_THREADS=1 "$RUNNER_TEMP/$t"
            if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 "$RUNNER_TEMP/$t"; fi
            echo "ALL NATIVE DIFFERENTIAL PASS $t"
          done
          if [ "${{ matrix.sanitize }}" = no ]; then
            export OMP_NUM_THREADS=1
            if [ "${{ matrix.mode }}" = openmp ]; then export OMP_NUM_THREADS=4; fi
            if ! make -C test -j2 check; then cat test/test-suite.log; exit 1; fi
            cat test/test-suite.log
          fi
          echo 'ALL EIGHT NATIVE CORE INTEGRATION PASS'
  abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          opts=(--enable-rci --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg --disable-omp)
          ./configure "${opts[@]}"
          make -C src -j2
          nm -D --defined-only src/.libs/liblis.so | awk '{print $3}' | LC_ALL=C sort -u > "$RUNNER_TEMP/baseline.symbols"
          readelf -d src/.libs/liblis.so | grep SONAME > "$RUNNER_TEMP/baseline.soname"
          make -C src clean
          python3 qualification/rci-restore/qualify_all_native.py
          make -C src -j2
          nm -D --defined-only src/.libs/liblis.so | awk '{print $3}' | LC_ALL=C sort -u > "$RUNNER_TEMP/combined.symbols"
          readelf -d src/.libs/liblis.so | grep SONAME > "$RUNNER_TEMP/combined.soname"
          diff -u "$RUNNER_TEMP/baseline.soname" "$RUNNER_TEMP/combined.soname"
          comm -23 "$RUNNER_TEMP/baseline.symbols" "$RUNNER_TEMP/combined.symbols" > "$RUNNER_TEMP/missing.symbols"
          cat "$RUNNER_TEMP/missing.symbols"
          test ! -s "$RUNNER_TEMP/missing.symbols"
          echo 'New qualification-only exported symbols (not approved public ABI):'
          comm -13 "$RUNNER_TEMP/baseline.symbols" "$RUNNER_TEMP/combined.symbols"
          echo 'BASELINE DYNAMIC SYMBOLS AND SONAME PRESERVED'
