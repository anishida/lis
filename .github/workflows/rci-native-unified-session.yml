name: RCI unified native session qualification
on:
  push:
    branches: ['qualification/rci-native-unified-session-20261127']
permissions:
  contents: read
jobs:
  unified:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, openmp]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          python3 qualification/rci-restore/qualify_all_native.py
          printf '\n#include "../../qualification/rci-restore/lis_rci_native_session.c"\n' >> src/esolver/lis_esolver_feast.c
          opts=(--enable-rci --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg)
          flags=(-std=gnu11 -DHAVE_CONFIG_H -O2)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp --enable-longlong); flags+=(-fopenmp -D_LONG__LONG); else opts+=(--disable-omp); fi
          ./configure "${opts[@]}"
          make -C src -j2
          cc "${flags[@]}" -Iinclude -Iqualification/rci-restore/ qualification/rci-restore/test_native_session.c -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -o "$RUNNER_TEMP/unified"
          ldd "$RUNNER_TEMP/unified" | grep -F "$PWD/src/.libs/liblis.so"
          OMP_NUM_THREADS=1 "$RUNNER_TEMP/unified"
          if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 "$RUNNER_TEMP/unified"; fi
