name: Stage8J frozen-pattern ILUT regression
on:
  push:
    branches:
      - feature/stage8j-frozen-ilut-refresh
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: real-serial, configure: '', cflags: '', threads: 1}
          - {name: real-openmp, configure: '--enable-omp', cflags: '-fopenmp', threads: 4}
          - {name: complex-serial, configure: '--enable-complex', cflags: '-D_COMPLEX', threads: 1}
          - {name: complex-openmp, configure: '--enable-complex --enable-omp', cflags: '-D_COMPLEX -fopenmp', threads: 4}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Configure and build LIS
        run: |
          autoreconf -fiv
          mkdir build
          cd build
          ../configure ${{ matrix.configure }}
          make -j2
          make -C test testsequence testoperatorrowprecon
      - name: Compile Stage8J standalone regression
        run: |
          gcc -DHAVE_CONFIG_H -Ibuild/include -Iinclude -Ibuild -I. -O2 ${{ matrix.cflags }} \
            validation/test_stage8j_frozen_ilut.c build/src/.libs/liblis.a -lm -o build/stage8j_probe
      - name: Focused tests
        env:
          OMP_NUM_THREADS: ${{ matrix.threads }}
          OMP_DYNAMIC: 'FALSE'
        run: |
          ./build/stage8j_probe
          ./build/test/testsequence
          if [ "${{ matrix.name }}" = "real-serial" ] || [ "${{ matrix.name }}" = "complex-serial" ]; then
            ./build/test/testoperatorrowprecon
          fi
