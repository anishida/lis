name: USER CG and QUAD preconditioner callback errors
on:
  push:
    branches: [develop]
    paths:
      - 'src/solver/lis_solver_cg.c'
      - 'src/solver/lis_solver.c'
      - 'test/testusercgerrors.c'
      - '.github/workflows/user-cg-callback-errors.yml'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
  pull_request:
    paths:
      - 'src/solver/lis_solver_cg.c'
      - 'src/solver/lis_solver.c'
      - 'test/testusercgerrors.c'
      - '.github/workflows/user-cg-callback-errors.yml'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cg-errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32","quad":"disabled"},{"mode":"release","index":"int64","quad":"disabled"},{"mode":"asan-ubsan","index":"int32","quad":"disabled"},{"mode":"asan-ubsan","index":"int64","quad":"disabled"},{"mode":"release","index":"int32","quad":"enabled"},{"mode":"asan-ubsan","index":"int64","quad":"enabled"}]' || '[{"mode":"release","index":"int32","quad":"disabled"},{"mode":"asan-ubsan","index":"int64","quad":"disabled"},{"mode":"release","index":"int32","quad":"enabled"},{"mode":"asan-ubsan","index":"int64","quad":"enabled"}]') }}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      UBSAN_OPTIONS: 'print_stacktrace=1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool libtool-bin
      - name: Build LIS and run native CG error propagation regression
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          quad_flags=""
          if [ "${{ matrix.quad }}" = enabled ]; then
            quad_flags="--enable-quad"
          fi
          ./configure --enable-omp --enable-test --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags} ${quad_flags}
          make -C src -j2
          make -C test testusercgerrors
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          ./test/testusercgerrors
