name: USER CG and QUAD preconditioner callback errors
on:
  pull_request:
    paths:
      - 'src/solver/lis_solver_cg.c'
      - 'test/testusercgerrors.c'
      - 'test/Makefile.am'
      - '.github/workflows/user-cg-callback-errors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cg-errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
        index: [int32, int64]
        quad: [disabled]
        include:
          - mode: release
            index: int32
            quad: enabled
          - mode: asan-ubsan
            index: int64
            quad: enabled
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      UBSAN_OPTIONS: 'print_stacktrace=1'
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool libtool-bin
      - name: Build LIS and run native CG error propagation regression
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          quad_flags=""
          if [ "${{ matrix.quad }}" = enabled ]; then
            quad_flags="--enable-quad"
          fi
          ./configure --enable-omp --enable-test --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags} ${quad_flags}
          make -C src -j2
          make -C test testusercgerrors
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          ./test/testusercgerrors
