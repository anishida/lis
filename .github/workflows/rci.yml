name: Experimental RCI
on:
  push:
    branches: [develop, 'release-candidate/rci-reconstructed-v1.0-serial-openmp']
    paths: ['configure*', '**/Makefile.am', '**/Makefile.in', 'src/**', 'include/**', 'test/testrci*', '.github/workflows/rci.yml']
  pull_request:
    branches: [develop]
    paths: ['configure*', '**/Makefile.am', '**/Makefile.in', 'src/**', 'include/**', 'test/testrci*', '.github/workflows/rci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: int32, mode: serial, sanitizer: 'no'}
          - {index: int64, mode: serial, sanitizer: 'no'}
          - {index: int32, mode: openmp, sanitizer: 'no'}
          - {index: int64, mode: openmp, sanitizer: 'no'}
          - {index: int32, mode: openmp, sanitizer: 'yes'}
          - {index: int64, mode: serial, sanitizer: 'yes'}
          - {index: int32, mode: serial, sanitizer: 'yes'}
          - {index: int64, mode: openmp, sanitizer: 'yes'}
    env:
      OMP_DYNAMIC: 'FALSE'
      ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          opts=(--enable-rci --enable-shared --disable-mpi --disable-complex --disable-longdouble --disable-quad --disable-fortran --disable-f90 --disable-saamg --prefix="$RUNNER_TEMP/install")
          flags=(-std=gnu11 -DHAVE_CONFIG_H -O2)
          if [ "${{ matrix.index }}" = int64 ]; then opts+=(--enable-longlong); flags+=(-D_LONG__LONG); fi
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp); flags+=(-fopenmp); else opts+=(--disable-omp); fi
          if [ "${{ matrix.sanitizer }}" = yes ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
            flags+=(-O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -no-pie)
          fi
          ./configure "${opts[@]}"
          make -C src -j2
          make -C include install
          make -C src install
          make -C test -j2 testrci testrcibridge testrcilarge testrciext testrcifull testrcistate testrcifaults testrcipoisson testrcisweep testrcimodel testrcirange
          lib="$RUNNER_TEMP/install/lib"; inc="$RUNNER_TEMP/install/include"
          export LD_LIBRARY_PATH="$lib"
          for t in testrci testrcibridge testrcilarge testrciext testrcifull testrcistate testrcifaults testrcipoisson testrcisweep testrcimodel testrcirange; do
            # Libtool's test/$t may be a shell wrapper; compile an installed-library consumer.
            cc "${flags[@]}" -I"$inc" "test/$t.c" -L"$lib" -Wl,-rpath,"$lib" -llis -lm -o "$RUNNER_TEMP/$t"
            ldd "$RUNNER_TEMP/$t" | grep -F "$lib/liblis.so"
            OMP_NUM_THREADS=1 timeout 120 "$RUNNER_TEMP/$t"
            if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 timeout 120 "$RUNNER_TEMP/$t"; fi
          done
          cc "${flags[@]}" -I"$inc" test/testrciabi.c -L"$lib" -Wl,-rpath,"$lib" -llis -lm -o "$RUNNER_TEMP/abi"
          "$RUNNER_TEMP/abi"
          if [ "${{ matrix.sanitizer }}" = no ]; then
            g++ -std=c++11 -I"$inc" test/testrcicxx.cpp -L"$lib" -Wl,-rpath,"$lib" -llis -lm -o "$RUNNER_TEMP/cxx"
            "$RUNNER_TEMP/cxx"
          fi
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Determine current merge base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/develop ]; then
            # Post-merge: compare opt-in and default builds of the same revision.
            target=HEAD
          elif [ -n "$PR_BASE_SHA" ]; then
            git fetch origin "$PR_BASE_SHA"
            target="$PR_BASE_SHA"
          else
            git fetch https://github.com/anishida/lis.git develop
            target=FETCH_HEAD
          fi
          base=$(git merge-base HEAD "$target")
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
      - name: Build base, default and opt-in libraries
        shell: bash
        run: |
          set -euo pipefail
          opts=(--enable-shared --disable-mpi --disable-omp --disable-fortran --disable-f90 --disable-saamg --disable-quad)
          build() {
            local dir="$1" prefix="$2"; shift 2
            (cd "$dir"; autoreconf -fiv; ./configure "${opts[@]}" --prefix="$prefix" "$@"; make -C src -j2; make -C include install; make -C src install)
          }
          build "$RUNNER_TEMP/base" "$RUNNER_TEMP/old"
          build "$PWD" "$RUNNER_TEMP/default"
          test ! -e "$RUNNER_TEMP/default/include/lis_rci.h"
          test ! -e "$RUNNER_TEMP/default/include/lis_rci_bridge.h"
          nm -D --defined-only "$RUNNER_TEMP/default/lib/liblis.so" > "$RUNNER_TEMP/default.sym"
          if grep -q ' lis_rci_' "$RUNNER_TEMP/default.sym"; then exit 1; fi
          make -C src clean
          build "$PWD" "$RUNNER_TEMP/new" --enable-rci
          for badflag in -ffast-math -ffinite-math-only; do
            if CFLAGS="-O2 $badflag" ./configure --enable-rci --disable-mpi --disable-quad --disable-complex --disable-longdouble --disable-fortran --disable-f90 --disable-saamg > "$RUNNER_TEMP/reject-math.log" 2>&1; then
              echo "unsafe RCI flags accepted: $badflag"; exit 1
            fi
            grep -F 'experimental RCI requires IEEE nonfinite checks' "$RUNNER_TEMP/reject-math.log"
            if cc -std=c11 "$badflag" -Iinclude -c src/lis_rci.c -o "$RUNNER_TEMP/unsafe.o" > "$RUNNER_TEMP/reject-core.log" 2>&1; then
              echo "unsafe core compilation accepted: $badflag"; exit 1
            fi
            grep -F 'experimental RCI requires IEEE nonfinite checks' "$RUNNER_TEMP/reject-core.log"
          done
          for bad in mpi quad complex longdouble; do
            if ./configure --enable-rci "--enable-$bad" > "$RUNNER_TEMP/reject-$bad.log" 2>&1; then
              echo "unsupported RCI configuration accepted: $bad"; exit 1
            fi
            grep -E 'experimental RCI requires|experimental RCI' "$RUNNER_TEMP/reject-$bad.log"
          done
      - name: Check existing headers, SONAME and binary compatibility
        shell: bash
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/old"; new="$RUNNER_TEMP/new"; base="$RUNNER_TEMP/base"
          for h in "$old"/include/*.h; do
            name=$(basename "$h")
            if [ "$name" != lis_config.h ]; then cmp "$h" "$new/include/$name"; fi
          done
          sym() { nm -D --defined-only "$1" | awk 'NF==3 {print $3,$2}' | LC_ALL=C sort -u; }
          sym "$old/lib/liblis.so" > "$RUNNER_TEMP/old.sym"
          sym "$new/lib/liblis.so" > "$RUNNER_TEMP/new.sym"
          LC_ALL=C comm -23 "$RUNNER_TEMP/old.sym" "$RUNNER_TEMP/new.sym" > "$RUNNER_TEMP/removed"
          LC_ALL=C comm -13 "$RUNNER_TEMP/old.sym" "$RUNNER_TEMP/new.sym" > "$RUNNER_TEMP/added"
          test ! -s "$RUNNER_TEMP/removed"
          test -s "$RUNNER_TEMP/added"
          if grep -v '^lis_rci_' "$RUNNER_TEMP/added"; then exit 1; fi
          # The documented declarations define the allowlist, not a stale count.
          sed -nE 's/^[[:alpha:]_][[:alnum:]_ *]*[[:space:]*](lis_rci_[[:alnum:]_]+)\(.*/\1/p' include/lis_rci.h include/lis_rci_bridge.h include/lis_rci_native.h | LC_ALL=C sort -u > "$RUNNER_TEMP/declared"
          awk '$1 ~ /^lis_rci_/ {print $1}' "$RUNNER_TEMP/added" | LC_ALL=C sort -u > "$RUNNER_TEMP/exported"
          diff -u "$RUNNER_TEMP/declared" "$RUNNER_TEMP/exported"
          diff <(readelf -d "$old/lib/liblis.so" | grep SONAME) <(readelf -d "$new/lib/liblis.so" | grep SONAME)
          for name in testabi testsolvercallbackcert testsolvercallbackpaths testkrylovrobust testpreconreuse testwarmstart; do
            cc -std=gnu11 -DHAVE_CONFIG_H -I"$old/include" -I"$base/include" "$base/test/$name.c" -L"$old/lib" -llis -lm -o "$RUNNER_TEMP/$name"
            for lib in "$old/lib" "$new/lib"; do
              LD_LIBRARY_PATH="$lib" ldd "$RUNNER_TEMP/$name" | grep -F "$lib/liblis.so"
              LD_LIBRARY_PATH="$lib" timeout 120 "$RUNNER_TEMP/$name"
            done
          done
