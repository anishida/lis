name: BSR transpose scratch OOM regression

on:
  push:
    branches: ['upstream/fix-bsr-transpose-oom-20261120']
  pull_request:
  workflow_dispatch:

concurrency:
  group: bsr-transpose-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bsr-transpose-oom:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
        index: [int32, int64]
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure and build with OOM injection
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
            export ASAN_OPTIONS="detect_leaks=0"
          else
            export CFLAGS="-O2 -g"
          fi
          if [ "${{ matrix.index }}" = "int64" ]; then
            export INDEX_FLAGS="--enable-longlong"
          else
            export INDEX_FLAGS=""
          fi
          ./configure --enable-test --enable-oom-tests --enable-omp \
            --disable-mpi --disable-fortran --disable-f90 --disable-saamg \
            $INDEX_FLAGS
          make -j2
          make -C test testoomalloc
      - name: Run block allocators and BSR transpose injected OOM
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then
            export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
            export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          fi
          ./test/testoomalloc 2>&1 | tee bsr-oom.log
          # Do not silently pass if the OOM regression compiled without
          # OpenMP and printed its standard "skipped" message.
          grep -Fqx 'BSR transpose: OpenMP scratch and injected OOM fallback passed' bsr-oom.log
          if grep -Fq 'BSR transpose OOM: skipped' bsr-oom.log; then
            echo 'ERROR: OpenMP BSR test was skipped' >&2
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsr-oom-${{ matrix.mode }}-${{ matrix.index }}
          path: |
            config.log
            bsr-oom.log
          if-no-files-found: ignore
