name: USER linear regression
on:
  pull_request:
    paths:
      - 'src/solver/lis_solver_bicgstab.c'
      - 'src/solver/lis_solver_bicgstabl.c'
      - 'src/solver/lis_solver_cg.c'
      - 'src/solver/lis_solver_cgs.c'
      - 'src/solver/lis_solver_fgcrodr.c'
      - 'src/solver/lis_solver_gcrodr.c'
      - 'src/solver/lis_solver_gmres.c'
      - 'src/solver/lis_solver_gpbicg.c'
      - 'src/solver/lis_solver_idrs.c'
      - 'src/solver/lis_solver_orthomin.c'
      - 'src/solver/lis_solver_qmr.c'
      - 'test/testbicgstablinit.c'
      - 'test/testuserbicgstabl.c'
      - 'test/testusercrcomplex.c'
      - 'test/testusercrserrors.c'
      - 'test/testuserfgcrodrerrors.c'
      - 'test/testusergcrodrerrors.c'
      - 'test/testusergmreserrors.c'
      - 'test/testusergpbic.c'
      - 'test/testuseridrcallback.c'
      - 'test/testuserorthominerrors.c'
      - 'test/testusertfqmrcallback.c'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/precon/lis_precon.c'
      - 'src/vector/**'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - '.github/workflows/user-linear-regression.yml'
  push:
    branches: [develop]
    paths:
      - 'src/solver/lis_solver_bicgstab.c'
      - 'src/solver/lis_solver_bicgstabl.c'
      - 'src/solver/lis_solver_cg.c'
      - 'src/solver/lis_solver_cgs.c'
      - 'src/solver/lis_solver_fgcrodr.c'
      - 'src/solver/lis_solver_gcrodr.c'
      - 'src/solver/lis_solver_gmres.c'
      - 'src/solver/lis_solver_gpbicg.c'
      - 'src/solver/lis_solver_idrs.c'
      - 'src/solver/lis_solver_orthomin.c'
      - 'src/solver/lis_solver_qmr.c'
      - 'test/testbicgstablinit.c'
      - 'test/testuserbicgstabl.c'
      - 'test/testusercrcomplex.c'
      - 'test/testusercrserrors.c'
      - 'test/testuserfgcrodrerrors.c'
      - 'test/testusergcrodrerrors.c'
      - 'test/testusergmreserrors.c'
      - 'test/testusergpbic.c'
      - 'test/testuseridrcallback.c'
      - 'test/testuserorthominerrors.c'
      - 'test/testusertfqmrcallback.c'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/precon/lis_precon.c'
      - 'src/vector/**'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - '.github/workflows/user-linear-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linear:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32"},{"mode":"release","index":"int64"},{"mode":"asan-ubsan","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]' || '[{"mode":"release","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]') }}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build once per configuration and run native regressions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
            export ASAN_OPTIONS="detect_leaks=0:halt_on_error=1"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          make -C src -j2
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          tests="testbicgstablinit testuserbicgstabl testusercrcomplex testusercrserrors testuserfgcrodrerrors testusergcrodrerrors testusergmreserrors testusergpbic testuseridrcallback testuserorthominerrors testusertfqmrcallback"
          make -C test $tests
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
          fi
          failed=0
          for t in $tests; do
            rc=0
            timeout 120s ./test/$t || rc=$?
            case $rc in
              0) echo "PASS: $t" ;;
              77) echo "SKIP: $t" ;;
              *) echo "FAIL: $t (exit $rc)"; failed=1 ;;
            esac
          done
          exit "$failed"
