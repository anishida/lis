name: Temporary projected Rayleigh Ritz verification

on:
  push:
    branches: [feature/krylov-rr-threshold-20261103]

jobs:
  numerical:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: "-O2"}
          - {name: clang, cc: clang, flags: "-O2"}
          - {name: gcc-openmp, cc: gcc, flags: "-O2 -fopenmp"}
          - {name: gcc-sanitizers, cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native Krylov tests
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          OMP_NUM_THREADS: '4'
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          set -euo pipefail
          for name in modes regression sparse semidefinite stress inertia window openmp projected; do
            "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c "test/test_krylov_${name}.c" -lm -o "test_${name}"
            "./test_${name}"
          done

  microbenchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare original and thresholded projected solver
        run: |
          set -euo pipefail
          git show 82008406e69e938e4aa3b1a7f5616a3731912c24:src/esolver/lis_krylov.c > test/baseline_krylov.c
          gcc -std=c99 -O3 -Iinclude -DKRYLOV_SOURCE='"baseline_krylov.c"' test/bench_krylov_projected.c -lm -o benchmark_baseline
          gcc -std=c99 -O3 -Iinclude test/bench_krylov_projected.c -lm -o benchmark_thresholded
          echo "BASELINE"
          ./benchmark_baseline
          echo "THRESHOLDED"
          ./benchmark_thresholded

  autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: Build LIS and run integrated regressions
        run: |
          set -euo pipefail
          autoreconf -fiv
          mkdir build && cd build
          ../configure --enable-omp
          make -j2
          make -C test test_krylov_projected test_krylov_lis
          ./test/test_krylov_projected
          ./test/test_krylov_lis
