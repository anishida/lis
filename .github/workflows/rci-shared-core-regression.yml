name: RCI shared native core regression and precision
on:
  push:
    branches: ['qualification/rci-shared-core-regression-20261127']
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: serial, index: int32}
          - {mode: openmp, index: int64}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          python3 qualification/rci-restore/qualify_linear_native.py
          python3 qualification/rci-restore/qualify_krylov_native.py
          opts=(--enable-rci --enable-test --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp); export OMP_NUM_THREADS=4; else opts+=(--disable-omp); export OMP_NUM_THREADS=1; fi
          if [ "${{ matrix.index }}" = int64 ]; then opts+=(--enable-longlong); fi
          ./configure "${opts[@]}"
          make -C src -j2
          make -C test -j2 check
          cat test/test-suite.log
          echo 'COMBINED NATIVE LINEAR AND KRYLOV REGRESSION PASS'
  precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scalar: [complex, extended, binary128, complex-binary128]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          python3 qualification/rci-restore/qualify_linear_native.py
          opts=(--disable-rci --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg --enable-shared --disable-omp)
          case "${{ matrix.scalar }}" in
            complex) opts+=(--enable-complex);;
            extended) opts+=(--enable-longdouble); export ac_cv_header_quadmath_h=no;;
            binary128) opts+=(--enable-longdouble);;
            complex-binary128) opts+=(--enable-longdouble --enable-complex);;
          esac
          ./configure "${opts[@]}"
          grep -E '^(#define|/\* #undef) (_LONG__DOUBLE|_COMPLEX|HAVE_QUADMATH_H)' include/lis_config.h
          case "${{ matrix.scalar }}" in
            extended) grep -q '^#define _LONG__DOUBLE 1' include/lis_config.h; ! grep -q '^#define HAVE_QUADMATH_H 1' include/lis_config.h;;
            binary128|complex-binary128) grep -q '^#define _LONG__DOUBLE 1' include/lis_config.h; grep -q '^#define HAVE_QUADMATH_H 1' include/lis_config.h;;
          esac
          if [[ "${{ matrix.scalar }}" == complex* ]]; then grep -q '^#define _COMPLEX 1' include/lis_config.h; fi
          make -C src -j2
          cc -std=gnu11 -DHAVE_CONFIG_H -O2 -Iinclude -Iqualification/rci-restore/ qualification/rci-restore/test_linear_precision.c -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -lquadmath -o "$RUNNER_TEMP/precision"
          OMP_NUM_THREADS=1 "$RUNNER_TEMP/precision"
