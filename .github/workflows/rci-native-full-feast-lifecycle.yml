name: RCI full native FEAST lifecycle qualification
on:
  push:
    branches: ['qualification/rci-native-full-feast-lifecycle-20261127']
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: serial, sanitize: 'no'}
          - {mode: openmp, sanitize: 'no'}
          - {mode: serial, sanitize: 'yes'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          python3 qualification/rci-restore/qualify_all_native.py
          python3 qualification/rci-restore/qualify_native_lifecycle.py
          python3 qualification/rci-restore/qualify_native_feast_lifecycle.py
          printf '\n#include "../../qualification/rci-restore/lis_rci_native_session.c"\n' >> src/esolver/lis_esolver_feast.c
          printf '\n#include "../../qualification/rci-restore/lis_rci_native_lifecycle.c"\n' >> src/solver/lis_solver.c
          printf '\n#include "../../qualification/rci-restore/lis_rci_native_feast_lifecycle.c"\n' >> src/esolver/lis_esolver.c
          opts=(--enable-rci --enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg)
          flags=(-std=gnu11 -DHAVE_CONFIG_H -O2)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp --enable-longlong); flags+=(-fopenmp -D_LONG__LONG); else opts+=(--disable-omp); fi
          if [ "${{ matrix.sanitize }}" = yes ]; then
            export CFLAGS='-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
            export LDFLAGS='-fsanitize=address,undefined'
            flags+=(-g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie)
          fi
          ./configure "${opts[@]}"
          make -C src -j2
          for t in native_lifecycle native_feast_lifecycle; do
            cc "${flags[@]}" -Iinclude -Iqualification/rci-restore/ "qualification/rci-restore/test_$t.c" -Lsrc/.libs -Wl,-rpath,"$PWD/src/.libs" -llis -lm -o "$RUNNER_TEMP/$t"
            export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
            OMP_NUM_THREADS=1 "$RUNNER_TEMP/$t"
            if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 "$RUNNER_TEMP/$t"; fi
          done
