name: Adaptive Krylov standalone validation

on:
  push:
    branches: [feature/krylov-adaptive-restart-20261103]
  pull_request:
    paths:
      - 'src/esolver/lis_krylov.c'
      - 'include/lis_krylov.h'
      - 'test/test_krylov_*.c'

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: gcc, flags: "-O2", name: gcc-serial}
          - {cc: gcc, flags: "-O2 -fopenmp", name: gcc-openmp}
          - {cc: clang, flags: "-O2", name: clang-serial}
          - {cc: gcc, flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer", name: gcc-sanitizers}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run standalone Krylov regressions
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
          OMP_NUM_THREADS: "4"
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -euo pipefail
          for name in modes sparse regression semidefinite stress inertia window openmp adaptive; do
            "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c "test/test_krylov_${name}.c" -lm -o "test_${name}"
            "./test_${name}"
          done
          "$CC" -std=c99 $FLAGS -Iinclude src/esolver/lis_krylov.c test/bench_krylov_adaptive.c -lm -o bench_adaptive
          ./bench_adaptive 80 3 6 16
