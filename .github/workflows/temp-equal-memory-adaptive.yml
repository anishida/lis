name: Temporary equal-memory adaptive benchmark

on:
  push:
    branches: [feature/krylov-adaptive-restart-20261103]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare fixed initial, intermediate, max and adaptive
        shell: bash
        run: |
          set -euo pipefail
          gcc -O3 -std=c99 -Iinclude src/esolver/lis_krylov.c test/bench_krylov_adaptive.c -lm -o adaptive_bench
          echo "CASE 80x80, nev=3, start=6, cap=24"
          ./adaptive_bench 80 3 6 24
          echo "CASE 120x120, nev=4, start=8, cap=24"
          ./adaptive_bench 120 4 8 24
          echo "CASE 64x64, nev=4, start=6, cap=24"
          ./adaptive_bench 64 4 6 24
          gcc -O2 -std=c99 -Iinclude src/esolver/lis_krylov.c test/test_krylov_adaptive.c -lm -o adaptive_regression
          ./adaptive_regression
