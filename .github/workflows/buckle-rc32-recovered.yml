name: Recovered RC32 LU validation
on:
  push:
    branches: [experiment/buckle-rc32-recovered-port]
  pull_request:
    branches: [develop]
    paths:
      - 'experimental/buckle-rc32/**'
      - 'src/precon/lis_ilutp_refactor.inc'
      - 'src/precon/lis_ilut_min_degree.inc'
      - '.github/workflows/buckle-rc32-recovered.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc32:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: serial
            configure: ''
            cflags: '-O2 -g'
            ldflags: ''
            suffix: serial
          - mode: omp
            configure: '--enable-omp'
            cflags: '-O2 -g'
            ldflags: ''
            suffix: omp
          - mode: serial
            configure: ''
            cflags: '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
            ldflags: '-fsanitize=address,undefined'
            suffix: asan-ubsan
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin python3-numpy python3-scipy
      - name: Build static LIS from current port
        env:
          CONFIGURE_OPTIONS: ${{ matrix.configure }}
          CFLAGS: ${{ matrix.cflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: |
          ./configure --enable-test --disable-shared --disable-fortran --disable-f90 --disable-saamg --disable-mpi $CONFIGURE_OPTIONS
          make -j2
      - name: Legacy regressions (no experimental flags)
        run: |
          ./test/testilutp
          ./test/testeigenbreakdown
          make -j2 check
      - name: Original RC32 driver regressions
        env:
          RC32_TEST_CFLAGS: ${{ matrix.cflags }}
          RC32_TEST_LDFLAGS: ${{ matrix.ldflags }}
        run: bash experimental/buckle-rc32/validate-port.sh "$PWD" "${{ matrix.mode }}" "$RUNNER_TEMP/rc32-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc32-${{ matrix.suffix }}
          path: ${{ runner.temp }}/rc32-results/
          if-no-files-found: ignore

  compatibility:
    name: Legacy configuration / ABI (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: complex
            options: '--enable-complex --disable-mpi'
          - mode: wide-index
            options: '--enable-longlong --disable-mpi'
          - mode: complex-wide
            options: '--enable-complex --enable-longlong --disable-mpi'
          - mode: half
            options: '--enable-half --disable-mpi'
          - mode: mpi
            options: '--enable-mpi MPICC=mpicc MPIRUN=mpiexec'
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public header matches upstream baseline exactly
        run: git diff --exit-code 6a4ae9c11bb03b028a6477455cb4f9f0a790132d HEAD -- include/lis.h
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin openmpi-bin libopenmpi-dev
      - name: Build from tracked Makefiles
        env:
          CONFIGURE_OPTIONS: ${{ matrix.options }}
        run: |
          ./configure --enable-test --disable-fortran --disable-f90 --disable-saamg --disable-omp $CONFIGURE_OPTIONS
          make -j2
      - name: Legacy ILUTP and MFAMG capability checks without experimental flags
        if: matrix.mode != 'mpi'
        run: |
          ./test/testilutp
          ./test/testmfamgilutp
          ./test/testeigenbreakdown
      - name: MPI smoke tests (single rank)
        if: matrix.mode == 'mpi'
        run: |
          ./test/testeigenbreakdown
          ./test/testmfamgilutp
      - name: Full legacy test suite
        if: matrix.mode != 'mpi'
        run: make -j2 check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rc32-compat-${{ matrix.mode }}-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore
