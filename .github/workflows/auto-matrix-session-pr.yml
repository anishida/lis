name: PR157 AUTO session regression
on:
  push:
    branches: [feature/auto-matrix-sequence-session-develop]
jobs:
  builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: real-serial, opts: "", cc: cc}
          - {name: real-openmp, opts: "--enable-omp", cc: cc}
          - {name: complex-serial, opts: "--enable-complex", cc: cc}
          - {name: complex-openmp, opts: "--enable-complex --enable-omp", cc: cc}
          - {name: real-longdouble, opts: "--enable-longdouble", cc: cc}
          - {name: complex-longdouble, opts: "--enable-complex --enable-longdouble", cc: cc}
          - {name: mpi-one-rank, opts: "--enable-mpi", cc: mpicc}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran openmpi-bin libopenmpi-dev
      - name: Compile and link
        run: |
          autoreconf -fiv
          mkdir build && cd build
          ../configure CC=${{ matrix.cc }} ${{ matrix.opts }}
          make -j2
          make -C test testmatrixautosession testmatrixpolicysolve testmatrixmaterialize testmatrixmaterializeomp testmatrixoperatorlifecycle
      - name: AUTO session and dependent regressions
        env:
          OMP_NUM_THREADS: '4'
          OMP_DYNAMIC: 'FALSE'
        run: |
          cd build
          ./test/testmatrixautosession
          ./test/testmatrixpolicysolve
          ./test/testmatrixmaterialize
          ./test/testmatrixmaterializeomp
          ./test/testmatrixoperatorlifecycle
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin gfortran
      - name: ASan/UBSan and leak detection
        env:
          OMP_NUM_THREADS: '4'
          OMP_DYNAMIC: 'FALSE'
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1:abort_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          autoreconf -fiv
          mkdir build && cd build
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" LDFLAGS="-fsanitize=address,undefined" ../configure --enable-omp
          make -j2
          make -C test testmatrixautosession testmatrixpolicysolve testmatrixmaterialize
          ./test/testmatrixautosession
          ./test/testmatrixpolicysolve
          ./test/testmatrixmaterialize
