name: Build and test (Linux / MSYS2 MinGW)

on:
  push:
    branches:
      - develop
      - ci/linux-mingw
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux GCC (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: serial
            options: ''
          - mode: openmp
            options: '--enable-omp'
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4

      - name: Install Autotools and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin

      - name: Configure
        env:
          CONFIGURE_OPTIONS: ${{ matrix.options }}
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi $CONFIGURE_OPTIONS

      - name: Build
        run: make -j2

      - name: Run Automake test suite
        run: make -j2 check

      - name: Verify portable FEA snapshot and optional DOF map
        run: |
          ./test/testsnapshot upstream-fea-snapshot
          python3 - <<'PY'
          import csv
          from pathlib import Path
          import math
          prefix = "upstream-fea-snapshot"
          expected = {"A": (2, 2), "b": (2, 1), "x0": (2, 1),
                      "x": (2, 1), "modes": (2, 2)}
          for suffix, shape in expected.items():
              path = Path(f"{prefix}_{suffix}.mtx")
              lines = path.read_text().splitlines()
              assert lines[0].lower().startswith("%%matrixmarket matrix "), path
              dims = [int(v) for v in lines[1].split()[:2]]
              assert tuple(dims) == shape, (path, dims)
              assert all(math.isfinite(float(row.split()[-1])) for row in lines[2:]), path
              path.unlink()
          with Path(f"{prefix}_dofs.csv").open(newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == 2
          assert rows[0] == {"eq": "0", "node": "node,7",
                             "dof": 'U"X', "body": "part A"}
          assert rows[1] == {"eq": "1", "node": "thermal-9",
                             "dof": "TEMP", "body": ""}
          Path(f"{prefix}_dofs.csv").unlink()
          PY

      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.mode }}-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore

  linux-mpi:
    name: Linux GCC (MPI, 2 ranks)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Autotools and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin \
            openmpi-bin libopenmpi-dev

      - name: Configure with MPI
        run: |
          set -o pipefail
          command -v mpicc
          command -v mpiexec
          autoreconf -fiv
          ./configure MPICC=mpicc MPIRUN=mpiexec --enable-test --enable-mpi \
            --disable-fortran --disable-f90 --disable-saamg --disable-omp \
            2>&1 | tee configure-output.log
          grep -Eq 'Build with MPI library[[:space:]]+=[[:space:]]+yes' configure-output.log

      - name: Build
        run: make -j2

      - name: Run Automake test suite
        run: make -j2 check

      - name: Run distributed MPI regressions (2 ranks)
        run: |
          mpiexec -n 2 ./test/testmatrixoperatormpi
          mpiexec -n 2 ./test/testvectornrm2mpi

      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mpi-logs
          path: |
            config.log
            configure-output.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore

  mingw:
    name: MSYS2 UCRT64 (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: serial
            openmp_package: ''
            options: ''
          - mode: openmp
            openmp_package: mingw-w64-ucrt-x86_64-libgomp
            options: '--enable-omp'
    defaults:
      run:
        shell: msys2 {0}
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 and native MinGW-w64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf automake libtool make
            mingw-w64-ucrt-x86_64-gcc
            ${{ matrix.openmp_package }}

      - name: Configure
        env:
          CONFIGURE_OPTIONS: ${{ matrix.options }}
        run: |
          gcc -dumpmachine | grep -q 'mingw32'
          autoreconf -fiv
          # Static linking makes the first native Windows CI independent of
          # the DLL export/import conventions used by downstream applications.
          set -o pipefail
          ./configure CC=gcc --enable-test --disable-shared --enable-static \
            --disable-fortran --disable-f90 --disable-saamg --disable-mpi \
            $CONFIGURE_OPTIONS 2>&1 | tee configure-output.log
          if [[ "$CONFIGURE_OPTIONS" == *--enable-omp* ]]; then
            if ! grep -Eq 'Build with OpenMP library[[:space:]]+=[[:space:]]+yes' configure-output.log; then
              echo "::error::OpenMP was requested but configure did not enable it"
              exit 1
            fi
          fi

      - name: Build
        run: make -j2

      - name: Run Automake test suite
        run: make -j2 check

      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-${{ matrix.mode }}-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore


  native-oom:
    name: Native OOM regressions (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure native OOM injector
        run: |
          autoreconf -fiv
          ./configure --enable-oom-tests --enable-test --disable-mpi \
            --disable-omp --disable-fortran --disable-f90 --disable-saamg
      - name: Build and run make check
        run: make -j2 check
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-oom-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore

  native-oom-mpi:
    name: Native OOM regressions (MPI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin \
            openmpi-bin libopenmpi-dev
      - name: Configure native OOM injector with MPI
        run: |
          autoreconf -fiv
          ./configure MPICC=mpicc MPIRUN=mpiexec --enable-oom-tests \
            --enable-test --enable-mpi --disable-omp --disable-fortran \
            --disable-f90 --disable-saamg
      - name: Compile MPI growth regression
        run: |
          make -j2
          make -C test testoommpiscale
      - name: Run MPI growth regression (single rank)
        run: ./test/testoommpiscale
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-oom-mpi-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore
