name: Build and test (Linux / MSYS2 MinGW)

on:
  push:
    branches:
      - develop
      - ci/linux-mingw
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-makefiles:
    name: Build from tracked Makefile.in (no autoreconf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool libtool-bin

      - name: Configure and build without regenerating Autotools files
        run: |
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi
          make -j2
          test -x test/testsnapshot
          ./test/testsnapshot
          ./test/testmfamg

      - name: Verify snapshot header is installed by tracked Makefile.in
        run: |
          make -C include install-data "DESTDIR=$RUNNER_TEMP/lis-staging"
          find "$RUNNER_TEMP/lis-staging" -type f -name lis_snapshot.h | grep -q .

  linux:
    name: Linux GCC (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: serial
            options: ''
          - mode: openmp
            options: '--enable-omp'
          - mode: half
            options: '--enable-half'
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4

      - name: Install Autotools and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin

      - name: Configure
        env:
          CONFIGURE_OPTIONS: ${{ matrix.options }}
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi $CONFIGURE_OPTIONS

      - name: Build
        run: make -j2

      - name: Run Automake test suite
        run: make -j2 check

      - name: Smoke-test optional 3D FP16 memory and Krylov benchmark
        if: matrix.mode == 'half'
        run: |
          set -euo pipefail
          # Small smoke case and a representative >100k-DOF 3D problem.
          # Each mode runs in a fresh process for comparable RSS snapshots.
          for side in 12 48; do
            ./test/testmfamg --fp16-3d-bench "$side" off | tee "mfamg-3d-$side-off.log"
            ./test/testmfamg --fp16-3d-bench "$side" on | tee "mfamg-3d-$side-on.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          def fields(path):
              line = next(x for x in Path(path).read_text().splitlines()
                          if x.startswith('MFAMG_FP16_3D '))
              return dict(x.split('=', 1) for x in line.split()[1:])
          for side in (12, 48):
              off = fields(f'mfamg-3d-{side}-off.log')
              on = fields(f'mfamg-3d-{side}-on.log')
              assert off['mode'] == 'off' and on['mode'] == 'on'
              assert off['dof'] == on['dof'] == str(side ** 3)
              assert float(off['ref_mb']) == float(off['resident_mb'])
              assert float(on['resident_mb']) < float(off['resident_mb'])
              assert int(off['iterations']) > 0 and int(on['iterations']) > 0
              assert float(off['relres']) < 1e-7 and float(on['relres']) < 1e-7
              print(f'3D FP16 benchmark passed ({side}^3):', off, on)
          PY

      - name: Audit generic FEA Matrix Market snapshot regressions
        run: python3 -m unittest discover -s tools -p 'test_fea_matrix_audit.py' -v

      - name: Smoke-test opt-in MFAMG contact diagnostics
        run: |
          set -o pipefail
          LIS_MFAMG_DIAG=1 ./test/testmfamg 2>&1 | tee mfamg-diagnostics.log
          grep -q '^LIS_MFAMG_DIAG_TRANSFER ' mfamg-diagnostics.log
          grep -q '^LIS_MFAMG_DIAG_MODE ' mfamg-diagnostics.log
          python3 - <<'PY'
          import math
          from pathlib import Path

          records = []
          for line in Path("mfamg-diagnostics.log").read_text().splitlines():
              if not line.startswith(("LIS_MFAMG_DIAG_TRANSFER ", "LIS_MFAMG_DIAG_MODE ")):
                  continue
              fields = dict(token.split("=", 1) for token in line.split()[1:])
              assert {"level", "mpi_rank", "n"} <= fields.keys(), line
              records.append((line.split()[0], fields))
          transfers = [v for kind, v in records if kind == "LIS_MFAMG_DIAG_TRANSFER"]
          modes = [v for kind, v in records if kind == "LIS_MFAMG_DIAG_MODE"]
          assert transfers and modes
          for v in transfers:
              aggregates = int(v["aggregates"])
              assert sum(int(v[k]) for k in ("singles", "pairs", "size3to8", "size9plus")) == aggregates
              assert sum(int(v[k]) for k in ("rank0", "rank1", "rank2", "rank3", "rank4plus")) == aggregates
              assert math.isclose(float(v["ratio"]), int(v["coarse_n"])/int(v["n"]), rel_tol=1e-8)
          # testmfamg includes a deterministic nine-row, two-mode basis
          # that must be exactly reconstructible by its aggregate-local QR.
          exact = [v for v in modes if v["level"] == "-1" and v["n"] == "9"]
          assert len(exact) >= 2, "manufactured low-level basis diagnostics absent"
          assert all(math.isfinite(float(v["relerr"])) and float(v["relerr"]) < 1e-10 for v in exact)
          PY

      - name: Verify generic snapshot values and optional DOF labels
        run: |
          ./test/testsnapshot upstream-generic-snapshot
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path

          prefix = "upstream-generic-snapshot"
          expected_matrix = {(1, 1): 4.0, (1, 2): -1.0,
                             (2, 1): -1.0, (2, 2): 3.0}
          expected_arrays = {"b": [2., 5.], "x0": [0., 0.],
                             "x": [1., 2.], "modes": [1., 1., 1., -1.]}

          def read_mm(suffix, fmt):
              path = Path(f"{prefix}_{suffix}.mtx")
              lines = [line.strip() for line in path.read_text().splitlines()]
              lines = [line for line in lines if line and
                       (line.startswith("%%MatrixMarket") or
                        not line.startswith("%"))]
              assert lines[0] == f"%%MatrixMarket matrix {fmt} real general"
              dimensions = tuple(map(int, lines[1].split()))
              return path, dimensions, lines[2:]

          path, shape, entries = read_mm("A", "coordinate")
          assert shape == (2, 2, 4)
          actual = {}
          for line in entries:
              i, j, value = line.split()
              key = (int(i), int(j))
              assert key not in actual
              actual[key] = float(value)
          assert actual.keys() == expected_matrix.keys()
          assert all(math.isfinite(actual[k]) and
                     math.isclose(actual[k], v, rel_tol=0, abs_tol=1e-13)
                     for k, v in expected_matrix.items())
          path.unlink()
          for suffix, expected in expected_arrays.items():
              path, shape, values = read_mm(suffix, "array")
              assert shape == (2, len(expected) // 2)
              actual = [float(v) for v in values]
              assert len(actual) == len(expected)
              assert all(math.isfinite(a) and
                         math.isclose(a, b, rel_tol=0, abs_tol=1e-13)
                         for a, b in zip(actual, expected))
              path.unlink()
          with Path(f"{prefix}_dofs.csv").open(newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert rows == [
              {"eq": "0", "node": "node,7", "dof": 'U"X',
               "body": "part A"},
              {"eq": "1", "node": "thermal-9", "dof": "TEMP", "body": ""},
          ]
          Path(f"{prefix}_dofs.csv").unlink()
          PY

      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.mode }}-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore

  linux-longlong:
    name: Linux GCC (64-bit LIS_INT RCO overflow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Autotools and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin

      - name: Build with 64-bit LIS_INT
        run: |
          autoreconf -fiv
          ./configure --enable-test --enable-longlong --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi --disable-omp
          make -j2

      - name: Verify RCO allocation-size overflow branch executes
        run: |
          set -o pipefail
          ./test/testrcoalloc | tee rco-overflow.log
          grep -q '^RCO_ALLOC_OVERFLOW: exercised real size_t guards$' rco-overflow.log
          grep -q '^RCO_ALLOC_SAFETY=PASSED$' rco-overflow.log

      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-longlong-rco-logs
          path: |
            config.log
            rco-overflow.log
            test/test-suite.log
          if-no-files-found: ignore

  fgcrodr-maxiter-lsan:
    name: FGCRO-DR MAXITER leak red/green proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      LSAN_OPTIONS: exitcode=23
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build sanitizer-enabled library and regression
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi --disable-omp \
            CC=gcc \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"
          make -j2
      - name: GREEN - patched MAXITER path has no detected leak
        run: ./test/testfgcrodrmaxiter
      - name: RED - temporary unfixed MAXITER path triggers LSan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/solver/lis_solver_fgcrodr.c")
          source = p.read_text()
          patch = ("    /* Release B even when active recycling runs into the ordinary\n"
                   "     * iteration cap (other FGCRO-DR exits already free it). */\n"
                   "    if( bcoef )\n"
                   "        lis_free(bcoef);\n")
          assert source.count(patch) == 1, "positive-fix anchor missing"
          p.write_text(source.replace(patch, "", 1))
          PY
          make -j2
          # The LIS test binary is statically linked: changing liblis.a
          # alone does not relink an existing test executable.
          touch test/testfgcrodrmaxiter.c
          make -C test testfgcrodrmaxiter
          set +e
          ./test/testfgcrodrmaxiter > /tmp/fgcrodr-negative-lsan.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: unfixed MAXITER unexpectedly passed LeakSanitizer"
            cat /tmp/fgcrodr-negative-lsan.log
            exit 1
          fi
          if ! grep -q 'LeakSanitizer: detected memory leaks' /tmp/fgcrodr-negative-lsan.log; then
            echo "ERROR: negative control did not fail specifically for a leak"
            cat /tmp/fgcrodr-negative-lsan.log
            exit 1
          fi
          echo "FGCRODR_MAXITER_LSAN_NEGATIVE_CONTROL=DETECTED"
      - name: GREEN again - restore and validate fix
        run: |
          git restore src/solver/lis_solver_fgcrodr.c
          make -j2
          touch test/testfgcrodrmaxiter.c
          make -C test testfgcrodrmaxiter
          ./test/testfgcrodrmaxiter
      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fgcrodr-maxiter-lsan-red-green
          path: |
            config.log
            test/*.log
          if-no-files-found: ignore


  fgcrodr-sanitizer:
    name: FGCRO-DR AddressSanitizer and LeakSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      LSAN_OPTIONS: exitcode=23:report_objects=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Autotools and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure with address and undefined-behavior sanitizers
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi --disable-omp \
            CC=gcc \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"
      - name: Build the FGCRO-DR library and targeted regressions
        run: |
          make -j2
      - name: Exercise active-recycle MAXITER and restart under sanitizers
        run: |
          ./test/testfgcrodrmaxiter
          ./test/testfgcrodrintra
          ./test/testfgcrodr
      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fgcrodr-sanitizer-logs
          path: |
            config.log
            test/*.log
          if-no-files-found: ignore

  linux-mpi:
    name: Linux GCC (MPI, 2 ranks)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Autotools and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin \
            openmpi-bin libopenmpi-dev

      - name: Configure with MPI
        run: |
          set -o pipefail
          command -v mpicc
          command -v mpiexec
          autoreconf -fiv
          ./configure MPICC=mpicc MPIRUN=mpiexec --enable-test --enable-mpi \
            --disable-fortran --disable-f90 --disable-saamg --disable-omp \
            2>&1 | tee configure-output.log
          grep -Eq 'Build with MPI library[[:space:]]+=[[:space:]]+yes' configure-output.log

      - name: Build
        run: make -j2

      - name: Run Automake test suite
        run: make -j2 check

      - name: Run distributed MPI regressions (2 ranks)
        run: |
          mpiexec -n 2 ./test/testmatrixoperatormpi
          mpiexec -n 2 ./test/testvectornrm2mpi
          mpiexec -n 2 ./test/testfgcrodrintra

      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mpi-logs
          path: |
            config.log
            configure-output.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore

  mingw:
    name: MSYS2 UCRT64 (${{ matrix.mode }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: serial
            openmp_package: ''
            options: ''
          - mode: openmp
            openmp_package: mingw-w64-ucrt-x86_64-libgomp
            options: '--enable-omp'
    defaults:
      run:
        shell: msys2 {0}
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 and native MinGW-w64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf automake libtool make
            mingw-w64-ucrt-x86_64-gcc
            ${{ matrix.openmp_package }}

      - name: Configure
        env:
          CONFIGURE_OPTIONS: ${{ matrix.options }}
        run: |
          gcc -dumpmachine | grep -q 'mingw32'
          autoreconf -fiv
          # Static linking makes the first native Windows CI independent of
          # the DLL export/import conventions used by downstream applications.
          set -o pipefail
          ./configure CC=gcc --enable-test --disable-shared --enable-static \
            --disable-fortran --disable-f90 --disable-saamg --disable-mpi \
            $CONFIGURE_OPTIONS 2>&1 | tee configure-output.log
          if [[ "$CONFIGURE_OPTIONS" == *--enable-omp* ]]; then
            if ! grep -Eq 'Build with OpenMP library[[:space:]]+=[[:space:]]+yes' configure-output.log; then
              echo "::error::OpenMP was requested but configure did not enable it"
              exit 1
            fi
          fi

      - name: Build
        run: make -j2

      - name: Run Automake test suite
        run: make -j2 check

      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ucrt64-${{ matrix.mode }}-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore


  native-oom:
    name: Native OOM regressions (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure native OOM injector
        run: |
          autoreconf -fiv
          ./configure --enable-oom-tests --enable-test --disable-mpi \
            --disable-omp --disable-fortran --disable-f90 --disable-saamg
      - name: Build and run make check
        run: make -j2 check
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-oom-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore

  native-oom-mpi:
    name: Native OOM regressions (MPI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin \
            openmpi-bin libopenmpi-dev
      - name: Configure native OOM injector with MPI
        run: |
          autoreconf -fiv
          ./configure MPICC=mpicc MPIRUN=mpiexec --enable-oom-tests \
            --enable-test --enable-mpi --disable-omp --disable-fortran \
            --disable-f90 --disable-saamg
      - name: Compile MPI growth regression
        run: |
          make -j2
          make -C test testoommpiscale
      - name: Run MPI growth regression (single rank)
        run: ./test/testoommpiscale
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-oom-mpi-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore
