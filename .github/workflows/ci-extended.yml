name: LIS extended regressions (develop / manual)
on:
  push:
    branches: [develop]
    paths:
      - 'src/solver/lis_solver_fgcrodr.c'
      - 'src/solver/lis_solver_gcrodr.c'
      - 'src/precon/**'
      - 'src/system/**'
      - 'src/matrix/**'
      - 'src/matvec/**'
      - 'src/vector/**'
      - 'test/testfgcrodr*'
      - 'test/testmfamg*'
      - 'test/testhalfilut.c'
      - 'test/testoom*'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - '.github/workflows/ci-extended.yml'
  pull_request:
    paths:
      - 'src/solver/lis_solver_fgcrodr.c'
      - 'src/solver/lis_solver_gcrodr.c'
      - 'src/precon/**'
      - 'src/system/**'
      - 'src/matrix/**'
      - 'src/matvec/**'
      - 'src/vector/**'
      - 'test/testfgcrodr*'
      - 'test/testmfamg*'
      - 'test/testhalfilut.c'
      - 'test/testoom*'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - '.github/workflows/ci-extended.yml'
  workflow_dispatch:
# These expensive sanitizer, OOM, scalar-ABI and race-audit jobs are
# preserved and run for matching critical changes on PRs and integration,
# or explicit dispatch, rather than rebuilding on every ordinary PR.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fgcrodr-maxiter-lsan:
    name: FGCRO-DR MAXITER leak red/green proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      LSAN_OPTIONS: exitcode=23
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build sanitizer-enabled library and regression
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi --disable-omp --enable-half \
            CC=gcc \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"
          make -j2
      - name: GREEN - patched MAXITER path has no detected leak
        run: ./test/testfgcrodrmaxiter
      - name: RED - temporary unfixed MAXITER path triggers LSan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/solver/lis_solver_fgcrodr.c")
          source = p.read_text()
          patch = ("    /* Release B even when active recycling runs into the ordinary\n"
                   "     * iteration cap (other FGCRO-DR exits already free it). */\n"
                   "    if( bcoef )\n"
                   "        lis_free(bcoef);\n")
          assert source.count(patch) == 1, "positive-fix anchor missing"
          p.write_text(source.replace(patch, "", 1))
          PY
          make -j2
          # The LIS test binary is statically linked: changing liblis.a
          # alone does not relink an existing test executable.
          touch test/testfgcrodrmaxiter.c
          make -C test testfgcrodrmaxiter
          set +e
          ./test/testfgcrodrmaxiter > /tmp/fgcrodr-negative-lsan.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: unfixed MAXITER unexpectedly passed LeakSanitizer"
            cat /tmp/fgcrodr-negative-lsan.log
            exit 1
          fi
          if ! grep -q 'LeakSanitizer: detected memory leaks' /tmp/fgcrodr-negative-lsan.log; then
            echo "ERROR: negative control did not fail specifically for a leak"
            cat /tmp/fgcrodr-negative-lsan.log
            exit 1
          fi
          echo "FGCRODR_MAXITER_LSAN_NEGATIVE_CONTROL=DETECTED"
      - name: GREEN again - restore and validate fix
        run: |
          git restore src/solver/lis_solver_fgcrodr.c
          make -j2
          touch test/testfgcrodrmaxiter.c
          make -C test testfgcrodrmaxiter
          ./test/testfgcrodrmaxiter
      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fgcrodr-maxiter-lsan-red-green
          path: |
            config.log
            test/*.log
          if-no-files-found: ignore


  fgcrodr-sanitizer:
    name: FGCRO-DR AddressSanitizer and LeakSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      LSAN_OPTIONS: exitcode=23:report_objects=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Autotools and compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure with address and undefined-behavior sanitizers
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi --disable-omp --enable-half \
            CC=gcc \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"
      - name: Build the FGCRO-DR library and targeted regressions
        run: |
          make -j2
      - name: Exercise active-recycle MAXITER and restart under sanitizers
        run: |
          ./test/testfgcrodrmaxiter
          ./test/testfgcrodrintra
          ./test/testfgcrodr

      - name: Validate ILUT RCM, RAS, Schur and contact KKT under sanitizers
        run: |
          make -C test testhalfilut
          ./test/testhalfilut
      - name: Validate MFAMG plus ILUTP lifecycle under ASan and UBSan
        run: |
          make -C test testmfamgilutp
          OMP_NUM_THREADS=1 ./test/testmfamgilutp
      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fgcrodr-sanitizer-logs
          path: |
            config.log
            test/*.log
          if-no-files-found: ignore

  tsan-archer-ilutp:
    name: TSan + LLVM Archer OpenMP RAS race audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      TSAN_OPTIONS: 'halt_on_error=1:exitcode=66:ignore_noninstrumented_modules=1'
      ARCHER_OPTIONS: 'verbose=1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang, LLVM OpenMP, Archer and Autotools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin \
            clang-18 libomp-18-dev llvm-18
      - name: Build all LIS code with ThreadSanitizer instrumentation
        run: |
          autoreconf -fiv
          ./configure --enable-test --enable-omp --enable-half \
            --disable-fortran --disable-f90 --disable-saamg --disable-mpi \
            CC=clang-18 \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=thread" \
            LDFLAGS="-fsanitize=thread"
          make -j2
          make -C test testhalfilut testmfamgvcycle
      - name: Run native pivot/overlap/OpenMP regression under Archer
        run: |
          set -euo pipefail
          archer=$(find /usr/lib/llvm-18 -name libarcher.so | head -1)
          test -f "$archer"
          export OMP_TOOL_LIBRARIES="$archer"
          export LLVM_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-18
          ./test/testhalfilut --parallel-ras-ilutp | tee tsan-archer-ras.log
          grep -q 'ILUT_RAS_OVERLAP overlap=2 full=1 threads=8 .* DETERMINISTIC PASS' tsan-archer-ras.log
          ./test/testmfamgvcycle --omp-stress | tee tsan-archer-mfamg.log
          grep -q 'MFAMG_OMP_STRESS mode=1 threads=8 .* PASS' tsan-archer-mfamg.log
          grep -q 'MFAMG_OMP_EDGES block=5 phase=1 threads=8 .* PASS' tsan-archer-mfamg.log
          grep -q 'MFAMG_OMP_MULTIVECTOR threads=8 .* PASS' tsan-archer-mfamg.log
      - name: Audit MFAMG plus local ILUTP RAS on OpenMP with Archer
        run: |
          set -euo pipefail
          archer=$(find /usr/lib/llvm-18 -name libarcher.so | head -1)
          test -f "$archer"
          export OMP_TOOL_LIBRARIES="$archer"
          export LLVM_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-18
          OMP_DYNAMIC=FALSE OMP_NUM_THREADS=4 ./test/testmfamgilutp --parallel-ras | tee tsan-archer-mfamg-ilutp-ras.log
          grep -q 'MFAMG_ILUTP_RAS threads=4 overlap=2 full=1 .* DETERMINISTIC PASS' tsan-archer-mfamg-ilutp-ras.log
      - name: Upload sanitizer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-archer-ras-diagnostics
          path: |
            config.log
            tsan-archer-ras.log
            tsan-archer-mfamg.log
            tsan-archer-mfamg-ilutp-ras.log
            test/test-suite.log
          if-no-files-found: ignore

  native-oom-parallel-ilutp:
    name: Native ILUTP parallel RAS injected-OOM regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install autotools and OpenMP toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure OpenMP and native OOM injection together
        run: |
          autoreconf -fiv
          ./configure --enable-oom-tests --enable-test --enable-omp --enable-half \
            --disable-fortran --disable-f90 --disable-saamg --disable-mpi
      - name: Build LIS and the isolated fault-injection test
        run: |
          make -j2
          make -C test testhalfilut
      - name: Verify RCO-to-CSR assembly OOM cleanup independently
        run: |
          set -euo pipefail
          ./test/testhalfilut --rco-assemble-oom | tee rco-assemble-oom.log
          grep -Eq '^RCO_ASSEMBLE_OOM_CLEANUP checked=[1-9][0-9]* PASS$' rco-assemble-oom.log
      - name: Inject OOM while ILUTP domains factor concurrently
        run: |
          set -euo pipefail
          ./test/testhalfilut --parallel-ras-ilutp | tee ilutp-ras-oom.log
          grep -q 'PARALLEL_RAS_OOM injected=.* PASS' ilutp-ras-oom.log
          grep -q 'ILUT_OPTIONS_OOM_PASS checked=' ilutp-ras-oom.log
          grep -q 'RCO_ASSEMBLE_OOM_CLEANUP checked=4 PASS' ilutp-ras-oom.log
      - name: Upload OOM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-oom-parallel-ras-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
            ilutp-ras-oom.log
            rco-assemble-oom.log
          if-no-files-found: ignore

  native-oom:
    name: Native OOM regressions (serial)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure native OOM injector
        run: |
          autoreconf -fiv
          ./configure --enable-oom-tests --enable-test --disable-mpi \
            --disable-omp --disable-fortran --disable-f90 --disable-saamg
      - name: Build and run make check
        run: make -j2 check
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-oom-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore

  native-oom-mpi:
    name: Native OOM regressions (MPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin \
            openmpi-bin libopenmpi-dev
      - name: Configure native OOM injector with MPI
        run: |
          autoreconf -fiv
          ./configure MPICC=mpicc MPIRUN=mpiexec --enable-oom-tests \
            --enable-test --enable-mpi --disable-omp --disable-fortran \
            --disable-f90 --disable-saamg
      - name: Compile MPI growth regression
        run: |
          make -j2
          make -C test testoommpiscale
      - name: Run MPI growth regression (single rank)
        run: ./test/testoommpiscale
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-oom-mpi-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
          if-no-files-found: ignore


  mfamg-ilutp-scalar-configurations:
    name: MFAMG+ILUTP build and test (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: complex
            options: '--enable-complex'
          - mode: quad
            options: '--enable-quad'
          - mode: longlong
            options: '--enable-longlong'
          - mode: complex-longlong
            options: '--enable-complex --enable-longlong'
          - mode: quad-longlong
            options: '--enable-quad --enable-longlong'
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure scalar build
        env:
          CONFIGURE_OPTIONS: ${{ matrix.options }}
        run: |
          autoreconf -fiv
          ./configure --enable-test --disable-fortran --disable-f90 \
            --disable-saamg --disable-mpi --disable-omp \
            $CONFIGURE_OPTIONS
      - name: Build all targets
        run: make -j2
      - name: Exercise MFAMG+ILUTP supported or rejected scalar path
        run: |
          make -C test testmfamgilutp
          ./test/testmfamgilutp


  mfamg-ilutp-ras-sanitizers:
    name: MFAMG+ILUTP OpenMP RAS ASan/UBSan/LSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      OMP_DYNAMIC: 'FALSE'
      ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1'
      LSAN_OPTIONS: 'exitcode=23:report_objects=1'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure OpenMP with AddressSanitizer and UBSan
        run: |
          autoreconf -fiv
          ./configure --enable-test --enable-omp \
            --disable-fortran --disable-f90 --disable-saamg --disable-mpi \
            CC=gcc \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"
      - name: Build all targets
        run: make -j2
      - name: Validate global composite and RAS 1/2/4 threads under sanitizers
        run: |
          set -euo pipefail
          OMP_NUM_THREADS=1 ./test/testmfamgilutp
          OMP_NUM_THREADS=4 ./test/testmfamgilutp --parallel-ras | tee mfamg-ilutp-ras-sanitizer.log
          grep -q 'MFAMG_ILUTP_RAS threads=1 overlap=1 full=0 .* DETERMINISTIC PASS' mfamg-ilutp-ras-sanitizer.log
          grep -q 'MFAMG_ILUTP_RAS_BITWISE threads=2_vs_4 overlap=1 domains=4 PASS' mfamg-ilutp-ras-sanitizer.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mfamg-ilutp-ras-sanitizer-logs
          path: |
            config.log
            test/test-suite.log
            test/*.log
            mfamg-ilutp-ras-sanitizer.log
          if-no-files-found: ignore
