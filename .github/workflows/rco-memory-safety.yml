name: Generic RCO allocation safety

on:
  push:
    branches:
      - 'upstream/rco-oom-safety-*'
  pull_request:
    paths:
      - 'src/matrix/lis_matrix.c'
      - 'src/matrix/lis_matrix_rco.c'
      - 'test/testrcoalloc.py'
      - '.github/workflows/rco-memory-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic RCO failure-injection tests
        run: python3 test/testrcoalloc.py
      - name: RCO failure paths under sanitizers
        run: LIS_RCO_ASAN=1 python3 test/testrcoalloc.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: serial
            configure_flags: ''
          - label: openmp
            configure_flags: '--enable-omp'
          - label: 64bit-indices
            configure_flags: '--enable-longlong'
    name: Build and solver smoke (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
      - name: Install LIS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin pkg-config gfortran
      - name: Configure, compile and run baseline smoke test
        run: |
          autoreconf -fiv
          mkdir build-rco
          cd build-rco
          ../configure ${{ matrix.configure_flags }}
          make -j2
          make -C test testuser
          ./test/testuser
