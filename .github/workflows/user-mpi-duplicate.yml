name: USER MPI null commtable duplication
on:
  push:
    branches: [develop]
    paths:
      - 'src/matrix/lis_matrix_user.c'
      - 'src/matrix/lis_matrix.c'
      - 'test/testusermpiduplicate.c'
      - '.github/workflows/user-mpi-duplicate.yml'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  pull_request:
    paths:
      - 'src/matrix/lis_matrix_user.c'
      - 'src/matrix/lis_matrix.c'
      - 'test/testusermpiduplicate.c'
      - '.github/workflows/user-mpi-duplicate.yml'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  workflow_dispatch:
jobs:
  mpi-duplicate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # PR: representative 32-bit release + 64-bit sanitizer coverage.
        # Push/manual: retain the complete four-configuration matrix.
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32"},{"mode":"release","index":"int64"},{"mode":"asan-ubsan","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]' || '[{"mode":"release","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin openmpi-bin libopenmpi-dev
      - name: Build and run MPI matrix duplicate regression
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
            export ASAN_OPTIONS="detect_leaks=0:halt_on_error=1"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          ./configure MPICC=mpicc MPIRUN=mpiexec --enable-test --enable-mpi --disable-omp --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          make -j2
          # Use the same Automake ABI and flags as the native LIS tests.
          make -C test testusermpiduplicate
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          mpiexec -n 1 ./test/testusermpiduplicate
          mpiexec -n 2 ./test/testusermpiduplicate
