name: CSR transpose single-worker fast path and OOM regression

on:
  push:
    branches: [develop]
    paths:
      - 'src/matvec/lis_matvec_csr.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'test/testcsrtransposeoom.c'
      - 'test/Makefile.am'
      - 'test/Makefile.in'
      - '.github/workflows/csr-transpose-single-thread.yml'
  pull_request:
    paths:
      - 'src/matvec/lis_matvec_csr.c'
      - 'src/system/lis_memory.c'
      - 'include/**'
      - 'configure.ac'
      - 'test/testcsrtransposeoom.c'
      - 'test/Makefile.am'
      - 'test/Makefile.in'
      - '.github/workflows/csr-transpose-single-thread.yml'
  workflow_dispatch:

concurrency:
  group: csr-transpose-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  csr-transpose-oom:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
        index: [int32, int64]
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Configure and build with OOM injection
        shell: bash
        run: |
          set -euo pipefail
          # Verify the checked-in generated Makefile.in without autoreconf
          # for one configuration; the other three regenerate as usual.
          if [ "${{ matrix.mode }}" = release ] && [ "${{ matrix.index }}" = int32 ]; then
            echo 'Building with tracked Autotools templates (no autoreconf)'
            MAINTAINER_FLAGS=--disable-maintainer-mode
          else
            autoreconf -fiv
            MAINTAINER_FLAGS=''
          fi
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
            export ASAN_OPTIONS="detect_leaks=0"
          else
            export CFLAGS="-O2 -g"
          fi
          INDEX_FLAGS=''
          if [ "${{ matrix.index }}" = int64 ]; then INDEX_FLAGS='--enable-longlong'; fi
          ./configure --enable-test --enable-oom-tests --enable-omp \
            --disable-mpi --disable-fortran --disable-f90 --disable-saamg \
            $INDEX_FLAGS $MAINTAINER_FLAGS
          make -j2
          make -C test testcsrtransposeoom
          git diff -- test/Makefile.in > test-makefile-generated.patch
          if [ "${{ matrix.mode }}" = release ] && [ "${{ matrix.index }}" = int32 ]; then
            # Fail if make silently regenerated the tracked template.
            git diff --exit-code -- test/Makefile.in
          fi
      - name: Check one-worker CSR transpose and multi-worker OOM
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          if [ "${{ matrix.mode }}" = "asan-ubsan" ]; then
            export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
            export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          fi
          timeout 90s ./test/testcsrtransposeoom 2>&1 | tee csr-transpose.log
          grep -Fqx 'CSR_TRANSPOSE_OOM PASS' csr-transpose.log
          grep -Fqx 'CSR_TRANSPOSE_OPENMP_EXECUTED' csr-transpose.log
          if grep -Eqi 'CSR_TRANSPOSE_OPENMP_SKIPPED|skipped \(requires OpenMP\)' csr-transpose.log; then
            echo 'CSR OpenMP regression unexpectedly skipped' >&2
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csr-transpose-${{ matrix.mode }}-${{ matrix.index }}
          path: |
            config.log
            csr-transpose.log
            test-makefile-generated.patch
            test/Makefile.in
          if-no-files-found: ignore

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [complex-openmp, serial-without-openmp]
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build complex or no-OpenMP variant
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.variant }}" = complex-openmp ]; then
            FEATURES='--enable-complex --enable-omp'
          else
            FEATURES='--disable-complex --disable-omp'
          fi
          ./configure --enable-test --enable-oom-tests \
            --disable-mpi --disable-fortran --disable-f90 --disable-saamg \
            $FEATURES CFLAGS='-O2 -g'
          make -j2
          make -C test testcsrtransposeoom
      - name: Verify conjugate transpose or real serial fallback
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          timeout 90s ./test/testcsrtransposeoom 2>&1 | tee csr-compat.log
          if [ "${{ matrix.variant }}" = complex-openmp ]; then
            grep -Fqx 'CSR_TRANSPOSE_OPENMP_EXECUTED' csr-compat.log
            grep -Fqx 'CSR_TRANSPOSE_OOM PASS' csr-compat.log
          else
            grep -Fqx 'CSR_TRANSPOSE_SERIAL_ONLY_PASS' csr-compat.log
            if grep -Fq 'CSR_TRANSPOSE_OPENMP_EXECUTED' csr-compat.log; then
              echo 'Unexpected OpenMP execution in serial-only build' >&2
              exit 1
            fi
          fi
      - name: Upload compatibility log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csr-compat-${{ matrix.variant }}
          path: |
            csr-compat.log
            config.log
          if-no-files-found: ignore
