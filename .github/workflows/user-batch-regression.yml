name: USER batch-row regression
on:
  push:
    branches: [develop]
    paths:
      - 'src/matrix/lis_matrix_user.c'
      - 'src/matvec/lis_matvec.c'
      - 'test/testuserbatch.c'
      - 'test/testuserbatchbench.c'
      - 'configure.ac'
      - '.github/workflows/user-batch-regression.yml'
      - 'src/solver/lis_solver.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'include/**'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  pull_request:
    paths:
      - 'src/matrix/lis_matrix_user.c'
      - 'src/matvec/lis_matvec.c'
      - 'test/testuserbatch.c'
      - 'test/testuserbatchbench.c'
      - 'configure.ac'
      - '.github/workflows/user-batch-regression.yml'
      - 'src/solver/lis_solver.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'include/**'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  workflow_dispatch:
jobs:
  user-batch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [off, asan-ubsan]
    env:
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build LIS and batch callback regression
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.sanitizer }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -DLIS_TEST_OOM -fsanitize=address,undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
          fi
          ./configure --enable-omp --enable-test --disable-mpi --disable-fortran --disable-f90 --disable-saamg
          make -j2
          cc -Iinclude -I. -fopenmp -Wall -Wextra -Werror test/testuserbatch.c \
            -Lsrc/.libs -llis -lm ${CFLAGS} ${LDFLAGS:-} -o test/testuserbatch
          cc -Iinclude -I. -fopenmp -Wall -Wextra -Werror test/testuserbatchbench.c \
            -Lsrc/.libs -llis -lm ${CFLAGS} ${LDFLAGS:-} -o test/testuserbatchbench
      - name: Compare scalar and batched USER callbacks
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          OMP_NUM_THREADS=1 ./test/testuserbatch
          OMP_NUM_THREADS=8 ./test/testuserbatch
          OMP_NUM_THREADS=1 ./test/testuserbatchbench | tee user-batch-benchmark.log
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-batch-${{ matrix.sanitizer }}
          path: config.log


  user-batch-tsan-archer:
    name: USER batch OpenMP race audit (TSan/Archer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '8'
      OMP_DYNAMIC: 'FALSE'
      TSAN_OPTIONS: 'halt_on_error=1:exitcode=66:ignore_noninstrumented_modules=1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and LLVM Archer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool libtool-bin clang-18 libomp-18-dev llvm-18
      - name: Compile with ThreadSanitizer instrumentation
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-mpi \
            --disable-fortran --disable-f90 --disable-saamg \
            CC=clang-18 CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=thread" \
            LDFLAGS="-fsanitize=thread"
          make -j2
          clang-18 -Iinclude -I. -fopenmp -fsanitize=thread \
            test/testuserbatch.c -Lsrc/.libs -llis -lm -o test/testuserbatch
      - name: Exercise thread-private batch caches
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          export LLVM_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-18
          archer=$(find /usr/lib/llvm-18 -name libarcher.so | head -1)
          test -f "$archer"
          export OMP_TOOL_LIBRARIES="$archer"
          ./test/testuserbatch | tee user-batch-tsan.log
          grep -q 'USER_BATCH PASS mode=1' user-batch-tsan.log
      - name: Upload TSan logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: user-batch-tsan-diagnostics
          path: |
            config.log
            user-batch-tsan.log
          if-no-files-found: ignore

  user-batch-no-openmp:
    name: USER row callbacks without OpenMP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Compile LIS and USER callbacks in serial-only mode
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          ./configure --enable-test --disable-omp --disable-mpi \
            --disable-fortran --disable-f90 --disable-saamg
          make -j2
          cc -Iinclude -I. -O2 -Wall -Wextra -Werror \
            test/testuserbatch.c -Lsrc/.libs -llis -lm -o test/testuserbatch
          cc -Iinclude -I. -O2 -Wall -Wextra -Werror \
            test/testuserbatchbench.c -Lsrc/.libs -llis -lm -o test/testuserbatchbench
      - name: Verify scalar and batch without parallel runtime
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          ./test/testuserbatch
          ./test/testuserbatchbench
