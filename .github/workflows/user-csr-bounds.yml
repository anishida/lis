name: USER to CSR bounds regression
on:
  pull_request:
  push:
    branches: [fix/user-to-csr-overflow-20261120]
  workflow_dispatch:

jobs:
  user-to-csr:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [release, asan-ubsan]
        index: [int32, int64]
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build and test USER to CSR bounds
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          ./configure --enable-omp --enable-test --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          make -j2
          # Build and run through the native Automake test harness.
          # Configure supplies the correct LIS_INT ABI for each build.
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          make -C test check TESTS=testusercsrbounds
