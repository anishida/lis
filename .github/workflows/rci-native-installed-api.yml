name: RCI native installed API qualification
on:
  push:
    branches: ['qualification/rci-native-installed-api-20261127']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, openmp, disabled]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: bash
        run: |
          set -euo pipefail
          opts=(--enable-shared --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg --prefix="$RUNNER_TEMP/install")
          flags=(-std=gnu11 -O2)
          if [ "${{ matrix.mode }}" = openmp ]; then opts+=(--enable-omp --enable-longlong); flags+=(-fopenmp); else opts+=(--disable-omp); fi
          if [ "${{ matrix.mode }}" = disabled ]; then opts+=(--disable-rci); else opts+=(--enable-rci); fi
          ./configure "${opts[@]}"
          make -C src -j2
          nm -D --defined-only src/.libs/liblis.so | awk '{print $3}' | LC_ALL=C sort -u > "$RUNNER_TEMP/baseline"
          make -C src clean
          python3 qualification/rci-restore/prepare_native_installed_api.py
          ./configure "${opts[@]}"
          cp "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/expected"
          if [ "${{ matrix.mode }}" != disabled ]; then
            printf '%s\n' lis_rci_native_create lis_rci_native_destroy lis_rci_native_start_linear lis_rci_native_start_feast lis_rci_native_start_krylov lis_rci_native_advance lis_rci_native_cancel lis_rci_native_pending lis_rci_native_status lis_rci_native_execute_default >> "$RUNNER_TEMP/expected"
          fi
          LC_ALL=C sort -u -o "$RUNNER_TEMP/expected" "$RUNNER_TEMP/expected"
          { echo '{ global:'; sed 's/$/;/' "$RUNNER_TEMP/expected"; echo 'local: *; };'; } > "$RUNNER_TEMP/exports.map"
          make -C src -j2 LDFLAGS="-Wl,--version-script=$RUNNER_TEMP/exports.map"
          nm -D --defined-only src/.libs/liblis.so | awk '{print $3}' | LC_ALL=C sort -u > "$RUNNER_TEMP/actual"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          make -C include install
          make -C src install
          if [ "${{ matrix.mode }}" = disabled ]; then
            test ! -e "$RUNNER_TEMP/install/include/lis_rci_native.h"
            echo 'DISABLED BASELINE EXPORTS PASS'
          else
            test -f "$RUNNER_TEMP/install/include/lis_rci_native.h"
            cd "$RUNNER_TEMP"
            cc "${flags[@]}" -I"$RUNNER_TEMP/install/include" "$GITHUB_WORKSPACE/qualification/rci-restore/test_native_installed.c" -L"$RUNNER_TEMP/install/lib" -Wl,-rpath,"$RUNNER_TEMP/install/lib" -llis -lm -o installed
            ldd installed | grep -F "$RUNNER_TEMP/install/lib/liblis.so"
            OMP_NUM_THREADS=1 ./installed
            if [ "${{ matrix.mode }}" = openmp ]; then OMP_NUM_THREADS=4 ./installed; fi
          fi
