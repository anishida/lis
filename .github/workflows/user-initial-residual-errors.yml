name: USER initial residual callback error regression
on:
  push:
    branches: [develop]
    paths:
      - 'src/solver/lis_solver.c'
      - 'src/matrix/lis_matrix_user.c'
      - 'test/testuser.c'
      - '.github/workflows/user-initial-residual-errors.yml'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/solver/lis_solver_*.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  pull_request:
    paths:
      - 'src/solver/lis_solver.c'
      - 'src/matrix/lis_matrix_user.c'
      - 'test/testuser.c'
      - '.github/workflows/user-initial-residual-errors.yml'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/solver/lis_solver_*.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  workflow_dispatch:
jobs:
  initial-user-error:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # PR: two ABI/sanitizer profiles plus QUAD compatibility.
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32","quad":"disabled"},{"mode":"release","index":"int64","quad":"disabled"},{"mode":"asan-ubsan","index":"int32","quad":"disabled"},{"mode":"asan-ubsan","index":"int64","quad":"disabled"},{"mode":"release","index":"int32","quad":"enabled"}]' || '[{"mode":"release","index":"int32","quad":"disabled"},{"mode":"asan-ubsan","index":"int64","quad":"disabled"},{"mode":"release","index":"int32","quad":"enabled"}]') }}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build and run USER initial-error regression
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          quad_flags=""
          if [ "${{ matrix.quad }}" = enabled ]; then
            quad_flags="--enable-quad"
          fi
          ./configure --enable-omp --enable-test --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags} ${quad_flags}
          make -j2
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          # testuser is a built test_PROGRAM but is not registered in TESTS.
          # Execute it directly rather than overriding Automake TESTS.
          ./test/testuser
