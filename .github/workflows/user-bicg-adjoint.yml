name: USER BiCG and BiCR callback errors
on:
  push:
    branches: [develop]
    paths:
      - 'src/solver/lis_solver_bicg.c'
      - 'src/solver/lis_solver_bicr.c'
      - 'src/solver/lis_solver.c'
      - 'src/matrix/lis_matrix_user.c'
      - 'test/testuserbicgadjoint.c'
      - '.github/workflows/user-bicg-adjoint.yml'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  pull_request:
    paths:
      - 'src/solver/lis_solver_bicg.c'
      - 'src/solver/lis_solver_bicr.c'
      - 'src/solver/lis_solver.c'
      - 'src/matrix/lis_matrix_user.c'
      - 'test/testuserbicgadjoint.c'
      - '.github/workflows/user-bicg-adjoint.yml'
      - 'src/matvec/lis_matvec.c'
      - 'src/vector/**'
      - 'src/precon/lis_precon.c'
      - 'include/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/system/lis_memory.c'
  workflow_dispatch:
jobs:
  bicg-bicr:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # PR: representative 32-bit release + 64-bit sanitizer coverage.
        # Push/manual: retain the complete four-configuration matrix.
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32"},{"mode":"release","index":"int64"},{"mode":"asan-ubsan","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]' || '[{"mode":"release","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]') }}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build and validate USER callback error handling
        shell: bash
        run: |
          set -euo pipefail
          autoreconf -fiv
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          ./configure --enable-omp --enable-test --disable-mpi --disable-fortran --disable-f90 --disable-saamg ${index_flags}
          make -j2
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          make -C test check TESTS=testuserbicgadjoint
