name: Experimental LDLT LIS bridge
on:
  pull_request:
    paths:
      - 'experimental/native-ldlt/**'
      - '.github/workflows/ldlt-lis-bridge.yml'
      - 'src/precon/**'
      - 'src/solver/**'
      - 'include/**'
  push:
    branches: [feature/native-multifrontal-ldlt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, sanitizer]
    env:
      OMP_NUM_THREADS: '1'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ubuntu dependencies
        run: |
          set -euo pipefail
          apt_options=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y build-essential autoconf automake libtool libtool-bin clang
      - name: Build native LIS and application-linked bridge
        run: |
          set -euo pipefail
          flags='-O2 -g'
          link=''
          if [ '${{ matrix.mode }}' = sanitizer ]; then
            flags='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all'
            link='-no-pie'
          fi
          ./configure --disable-omp --disable-mpi --disable-quad --disable-fortran --disable-f90 --disable-saamg --disable-shared --enable-static CFLAGS="$flags" LDFLAGS="$flags"
          make -C src -j2
          d=experimental/native-ldlt
          cc -std=c11 -DHAVE_CONFIG_H -DP66_DISABLE_SIMD -Iinclude -I"$d" $flags $link \
            "$d"/lis_ldlt_user_bridge.c "$d"/test_lis_ldlt_bridge.c \
            "$d"/packed_ldlt.c "$d"/lis_adapter.c "$d"/multifrontal_ldlt.c \
            "$d"/schur_simd.c "$d"/symbolic_ldlt.c "$d"/minimum_degree.c "$d"/qmd_plan.c src/.libs/liblis.a -lm -o ldlt-lis-test
          ./ldlt-lis-test 2>&1 | tee ldlt-lis.log
          grep -Fx LDLT_LIS_BRIDGE=PASS ldlt-lis.log
          cc -std=c11 -DHAVE_CONFIG_H -DP66_DISABLE_SIMD -Iinclude -I"$d" $flags $link \
            "$d"/lis_ldlt_user_bridge.c "$d"/test_lis_ldlt_refresh.c "$d"/qmd_plan.c \
            "$d"/packed_ldlt.c "$d"/lis_adapter.c "$d"/multifrontal_ldlt.c \
            "$d"/schur_simd.c "$d"/symbolic_ldlt.c "$d"/minimum_degree.c src/.libs/liblis.a -lm -o ldlt-refresh-test
          ./ldlt-refresh-test 2>&1 | tee ldlt-refresh.log
          grep -Fx LDLT_LIS_REFRESH=PASS ldlt-refresh.log
          cc -std=c11 -Wall -Wextra -Werror -DP66_DISABLE_SIMD $flags $link -I"$d" \
            "$d"/test_qmd_plan.c "$d"/qmd_plan.c "$d"/minimum_degree.c "$d"/packed_ldlt.c \
            "$d"/lis_adapter.c "$d"/multifrontal_ldlt.c "$d"/schur_simd.c "$d"/symbolic_ldlt.c -lm -o ldlt-plan-test
          ./ldlt-plan-test 2>&1 | tee ldlt-plan.log
          grep -Fx 'QMD plan 32/32 PASS' ldlt-plan.log
          # Only the AVX2 lower path uses the optional OpenMP team. The
          # standalone AVX2 suite includes range errors and nested calls.
          cc -std=c11 -Wall -Wextra -Werror -fopenmp $flags $link -I"$d" \
            "$d"/test_schur_omp.c "$d"/schur_simd.c -lm -o ldlt-omp-test
          set +e
          OMP_NUM_THREADS=4 OMP_DYNAMIC=FALSE ./ldlt-omp-test 2>&1 | tee ldlt-omp.log
          omp_rc=${PIPESTATUS[0]}
          set -e
          if [ "$omp_rc" -eq 77 ]; then
            grep -Fx 'OpenMP AVX2 unavailable: SKIP' ldlt-omp.log
          else
            test "$omp_rc" -eq 0
            grep -Fx 'Schur OpenMP 121/121 PASS' ldlt-omp.log
          fi
          cc -std=c11 -Wall -Wextra -Werror -DP66_DISABLE_SIMD $flags $link -I"$d" \
            "$d"/test_quotient_ordering.c "$d"/minimum_degree.c "$d"/packed_ldlt.c \
            "$d"/lis_adapter.c "$d"/multifrontal_ldlt.c "$d"/schur_simd.c "$d"/symbolic_ldlt.c -lm -o ldlt-qmd-test
          ./ldlt-qmd-test 2>&1 | tee ldlt-qmd.log
          grep -q "^quotient ordering 900/900 PASS" ldlt-qmd.log
          # Exercise actual runtime SIMD dispatch as well as the portable bridge.
          # Clang is used for the vector sanitizer test (GCC 14 ASan crashes
          # on the original AVX-512 intrinsic stack path on the development VM).
          simd_cc=cc
          if [ '${{ matrix.mode }}' = sanitizer ]; then simd_cc=clang; fi
          "$simd_cc" -std=c11 -Wall -Wextra -Werror $flags $link -I"$d" \
            "$d"/test_simd.c "$d"/minimum_degree.c "$d"/nested_dissection.c \
            "$d"/packed_ldlt.c "$d"/lis_adapter.c "$d"/multifrontal_ldlt.c \
            "$d"/schur_simd.c "$d"/symbolic_ldlt.c -lm -o ldlt-simd-test
          ./ldlt-simd-test 2>&1 | tee ldlt-simd.log
          grep -Eq '^SIMD [0-9]+/[0-9]+ PASS' ldlt-simd.log
          # Qualify the numeric front assembly/pivot path, including
          # delayed pivots, large sparse fixtures and strict supernodes.
          for suite in multifrontal supernodal; do
            "$simd_cc" -std=c11 -Wall -Wextra -Werror $flags $link -I"$d" \
              "$d/test_${suite}.c" "$d"/minimum_degree.c "$d"/nested_dissection.c \
              "$d"/packed_ldlt.c "$d"/lis_adapter.c "$d"/multifrontal_ldlt.c \
              "$d"/schur_simd.c "$d"/symbolic_ldlt.c "$d"/factor_cache.c -lm -o "ldlt-${suite}-test"
            "./ldlt-${suite}-test" 2>&1 | tee "ldlt-${suite}.log"
            grep -Eq "^${suite} [0-9]+/[0-9]+ PASS" "ldlt-${suite}.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldlt-lis-${{ matrix.mode }}
          path: |
            ldlt-lis.log
            ldlt-refresh.log
            ldlt-plan.log
            ldlt-omp.log
            ldlt-qmd.log
            ldlt-simd.log
            ldlt-multifrontal.log
            ldlt-supernodal.log
