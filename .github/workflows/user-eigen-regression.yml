name: USER eigen regression
on:
  pull_request:
    paths:
      - 'src/esolver/lis_esolver.c'
      - 'src/esolver/lis_esolver_ai.c'
      - 'src/esolver/lis_esolver_cg.c'
      - 'src/esolver/lis_esolver_ii.c'
      - 'src/esolver/lis_esolver_li.c'
      - 'src/esolver/lis_esolver_pi.c'
      - 'src/esolver/lis_esolver_rqi.c'
      - 'src/esolver/lis_esolver_si.c'
      - 'test/testusereigencgcr.c'
      - 'test/testusereigeninverse.c'
      - 'test/testusereigenpower.c'
      - 'test/testusereigenprojection.c'
      - 'test/testusereigenrqiguard.c'
      - 'test/testusereigenstatus.c'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/precon/lis_precon.c'
      - 'src/vector/**'
      - 'src/system/lis_memory.c'
      - 'src/system/lis_error.c'
      - 'src/matrix/lis_matrix_ops.c'
      - 'src/esolver/lis_gesolve_matrix_session.c'
      - 'test/testgesolvepair.c'
      - 'include/lis.h'
      - 'include/lislib.h'
      - 'include/lis_system.h'
      - 'include/lis_esolver.h'
      - 'include/lis_solver.h'
      - 'include/lis_matrix.h'
      - 'include/lis_matvec.h'
      - 'include/lis_precon.h'
      - 'include/lis_vector.h'
      - 'include/lis_precision.h'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/solver/lis_solver_bicg.c'
      - 'src/solver/lis_solver_cg.c'
      - '.github/workflows/user-eigen-regression.yml'
  push:
    branches: [develop]
    paths:
      - 'src/esolver/lis_esolver.c'
      - 'src/esolver/lis_esolver_ai.c'
      - 'src/esolver/lis_esolver_cg.c'
      - 'src/esolver/lis_esolver_ii.c'
      - 'src/esolver/lis_esolver_li.c'
      - 'src/esolver/lis_esolver_pi.c'
      - 'src/esolver/lis_esolver_rqi.c'
      - 'src/esolver/lis_esolver_si.c'
      - 'test/testusereigencgcr.c'
      - 'test/testusereigeninverse.c'
      - 'test/testusereigenpower.c'
      - 'test/testusereigenprojection.c'
      - 'test/testusereigenrqiguard.c'
      - 'test/testusereigenstatus.c'
      - 'src/solver/lis_solver.c'
      - 'src/matvec/lis_matvec.c'
      - 'src/matrix/lis_matrix.c'
      - 'src/precon/lis_precon.c'
      - 'src/vector/**'
      - 'src/system/lis_memory.c'
      - 'src/system/lis_error.c'
      - 'src/matrix/lis_matrix_ops.c'
      - 'src/esolver/lis_gesolve_matrix_session.c'
      - 'test/testgesolvepair.c'
      - 'include/lis.h'
      - 'include/lislib.h'
      - 'include/lis_system.h'
      - 'include/lis_esolver.h'
      - 'include/lis_solver.h'
      - 'include/lis_matrix.h'
      - 'include/lis_matvec.h'
      - 'include/lis_precon.h'
      - 'include/lis_vector.h'
      - 'include/lis_precision.h'
      - 'configure.ac'
      - 'Makefile.am'
      - 'src/Makefile.am'
      - 'include/Makefile.am'
      - 'src/solver/lis_solver_bicg.c'
      - 'src/solver/lis_solver_cg.c'
      - '.github/workflows/user-eigen-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eigen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'pull_request' && '[{"mode":"release","index":"int32"},{"mode":"release","index":"int64"},{"mode":"asan-ubsan","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]' || '[{"mode":"release","index":"int32"},{"mode":"asan-ubsan","index":"int64"}]') }}
    env:
      OMP_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libtool-bin
      - name: Build once per configuration and run native regressions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"
            export LDFLAGS="-fsanitize=address,undefined"
            export ASAN_OPTIONS="detect_leaks=0:halt_on_error=1"
          else
            export CFLAGS="-O2 -g"
            export LDFLAGS=""
          fi
          index_flags=""
          if [ "${{ matrix.index }}" = int64 ]; then
            index_flags="--enable-longlong"
          fi
          autoreconf -fiv
          ./configure --enable-test --enable-omp --disable-mpi --disable-fortran --disable-f90 --disable-saamg --enable-oom-tests ${index_flags}
          make -C src -j2
          export LD_LIBRARY_PATH="$PWD/src/.libs:${LD_LIBRARY_PATH:-}"
          make -C test testusereigencgcr testusereigeninverse testusereigenpower testusereigenprojection testusereigenrqiguard testusereigenstatus testgesolvepair
          if [ "${{ matrix.mode }}" = asan-ubsan ]; then
            export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
          fi
          failed=0
          for t in testusereigencgcr testusereigeninverse testusereigenpower testusereigenprojection testusereigenrqiguard testusereigenstatus testgesolvepair; do
            rc=0
            timeout 120s ./test/$t || rc=$?
            case $rc in
              0) echo "PASS: $t" ;;
              77) echo "FAIL: unexpected skip: $t"; failed=1 ;;
              *) echo "FAIL: $t (exit $rc)"; failed=1 ;;
            esac
          done
          exit "$failed"
